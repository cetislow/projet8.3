<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de tâches</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête -->
    <header class="entete">
        <h1>Gestionnaire de tâches</h1>
        <p>Projet 8.3 - Semaine 8</p>
    </header>

    <main>

        <!-- Tableau de bord -->
        <section class="kpi">

            <article class="carte-kpi">
                <h2>Total</h2>
                <p id="total">0</p>
            </article>

            <article class="carte-kpi">
                <h2>Terminées</h2>
                <p id="terminees">0</p>
            </article>

            <article class="carte-kpi">
                <h2>Complétion</h2>
                <p id="taux">0%</p>

                <div class="barre">
                    <div id="progression" class="progression"></div>
                </div>
            </article>

        </section>

        <!-- Barre de filtres -->
        <section class="filtres">

            <button>Toutes</button>
            <button>En cours</button>
            <button>Terminées</button>

        </section>

        <!-- Liste des tâches -->
        <section class="liste">

            <h2>Mes tâches</h2>

            <div id="sortie">
                <!-- Le JavaScript affichera les tâches ici -->
            </div>

        </section>

    </main>

    <footer>
        <p>Akieni Academy - Cohorte 2 - 2026</p>
    </footer>

    <script src="taches.js"></script>

</body>
</html>
